<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>«Дальневосточный федеральный округ»: квиз</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Manrope:wght@400;600;800&display=swap">
<style id="css">
:root{--ink:#0c2630;--sea:#145366;--foam:#eaf3f1;--buoy:#e8482b;--sand:#f3c97a;--pa:.6;--panel:rgba(12,38,48,var(--pa));--tile:rgba(20,83,102,var(--pa));--line:rgba(234,243,241,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:"Manrope",system-ui,sans-serif;color:var(--foam);background:var(--ink) center/cover fixed no-repeat;}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(12,38,48,.25),rgba(12,38,48,.5));z-index:0}
.tools label.slider{display:flex;align-items:center;gap:8px}.slider input{width:110px;accent-color:var(--sand)}
h1,.cat,.tile,.ph,.hint{text-shadow:0 1px 3px rgba(6,18,24,.7)}
main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:16px 12px 28px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1,.title-input{font-family:"Oswald",Impact,sans-serif;font-weight:700;font-size:clamp(26px,5vw,44px);margin:0;letter-spacing:.5px;color:var(--foam)}
.title-input{background:transparent;border:1px dashed var(--sand);border-radius:6px;padding:2px 8px;width:min(100%,640px)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:600 14px "Manrope",sans-serif;color:var(--foam);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--sand)}
button:focus-visible,.btn:focus-within,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.primary{background:var(--buoy);border-color:var(--buoy);color:#fff}
.on{background:var(--sand);color:var(--ink);border-color:var(--sand)}
.board{display:grid;grid-template-columns:minmax(78px,1.5fr) repeat(5,1fr);gap:6px}
.cat{display:flex;align-items:center;padding:8px 10px;background:var(--panel);border-left:5px solid var(--buoy);border-radius:6px;font-family:"Oswald",sans-serif;font-weight:500;font-size:clamp(11px,2.2vw,22px);line-height:1.15;min-height:clamp(54px,11vw,92px);overflow-wrap:anywhere}
.cat input{width:100%;font:inherit;color:inherit;background:transparent;border:1px dashed var(--sand);border-radius:4px;padding:2px}
.corner{background:none;border:0}
.ph{display:flex;align-items:center;justify-content:center;font:600 12px "Manrope";color:var(--sand);padding-bottom:2px}
.ph input{width:100%;max-width:70px;text-align:center;font:inherit;background:transparent;color:var(--sand);border:1px dashed var(--sand);border-radius:4px}
.tile{min-height:clamp(54px,11vw,92px);display:flex;align-items:center;justify-content:center;font-family:"Oswald",sans-serif;font-weight:700;font-size:clamp(16px,3.6vw,38px);color:var(--sand);background:var(--tile);border:1px solid var(--line);border-radius:6px;padding:0}
.tile:hover{background:var(--sea);transform:translateY(-2px)}
.tile.used{background:rgba(12,38,48,.45);color:transparent;border-style:dashed;cursor:pointer}
.tile.used:hover{transform:none}
.editing .tile{color:var(--foam)}
.hint{margin:12px 2px 0;font-size:13px;opacity:.85}
#modal{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top,0px)) 14px max(14px,env(safe-area-inset-bottom,0px));background:rgba(6,18,24,.84)}
#modal.open{display:flex}
.card{width:min(960px,100%);max-height:100%;overflow:auto;background:var(--ink);border:1px solid var(--line);border-top:6px solid var(--buoy);border-radius:12px;padding:clamp(18px,4vw,40px)}
@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.tile:hover{transform:none}}
.meta{font:500 clamp(16px,2.6vw,24px) "Oswald",sans-serif;color:var(--sand);margin-bottom:14px}
.q{font-size:clamp(20px,3.6vw,38px);font-weight:600;line-height:1.35;margin:0 0 22px;max-width:34em}
.ans{display:none;margin:0 0 22px;padding:14px 18px;background:var(--sea);border-left:6px solid var(--sand);border-radius:6px;font-size:clamp(20px,3.4vw,34px);font-weight:800}
.ans.show{display:block}
.row{display:flex;gap:10px;flex-wrap:wrap}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
textarea{width:100%;min-height:96px;font:400 16px/1.4 "Manrope",sans-serif;color:var(--foam);background:rgba(234,243,241,.08);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
input[type=file]{display:none}

@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes mIn{from{opacity:0}to{opacity:1}}
@keyframes mOut{from{opacity:1}to{opacity:0}}
@keyframes zoomIn{from{opacity:0;transform:scale(.15)}60%{opacity:1}to{opacity:1;transform:none}}
@keyframes zoomOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.6)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ansIn{from{opacity:0;transform:translateY(16px) scale(.96);background:var(--sand)}to{opacity:1;transform:none}}
header{animation:fade .6s ease both}
.board.enter .tile,.board.enter .cat,.board.enter .ph{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.tile{transition:transform .15s,background .3s,color .3s,border-color .3s}
.tile:active{transform:scale(.94)}
#modal.open{animation:mIn .22s ease-out both}
#modal.closing{animation:mOut .2s ease-in both}
.card.in{animation:zoomIn .38s cubic-bezier(.2,.85,.25,1) both}
.card.out{animation:zoomOut .2s ease-in both}
.card.in .meta,.card.in .q{animation:up .5s .15s both ease-out}
.card.in .q{animation-delay:.28s}
.ans.show{animation:ansIn .5s cubic-bezier(.2,.9,.3,1.25) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>

<script id="state" type="application/json">{"title":"«Дальневосточный федеральный округ»: квиз","points":[100,200,300,400,500],"cats":[{"name":"География и рекорды","qs":[["На этом полуострове расположено около 30 действующих вулканов и знаменитая Долина гейзеров.","Камчатка"],["Это село в Якутии неофициально считают «Полюсом холода» северного полушария, где температура опускалась почти до −68 °C.","Оймякон"],["Сколько субъектов входят в ДФО?","11 (Амурская область, Еврейская автономная область, Забайкальский край, Камчатский край, Магаданская область, Приморский край, Республика Бурятия, Республика Саха (Якутия), Сахалинская область, Хабаровский край, Чукотский автономный округ)"],["Это море почти со всех сторон окружено территорией России (Камчаткой, Курилами и Сахалином).","Охотское море"],["Назовите два субъекта РФ с берегов Байкала, которые вошли в состав Дальневосточного федерального округа только в конце 2018 года, перейдя из Сибирского округа.","Республика Бурятия и Забайкальский край"]]},{"name":"Символы","qs":[["Пилоны этого знаменитого вантового моста через бухту Золотой Рог имеют форму латинской буквы «V», что отсылает к первой букве названия города. Назовите мост.","Золотой мост"],["На пятитысячной купюре изображен мост через реку Амур и памятник графу Муравьёву-Амурскому, стоящий в этом крупном дальневосточном городе.","Хабаровск"],["На перроне железнодорожного вокзала во Владивостоке стоит памятный верстовой столб, на котором выбито четырехзначное число «9288». Символом финальной точки какого грандиозного транспортного пути является этот столб?","Транссибирская магистраль (Транссиб)"],["Какие 3 объекта, расположенные в ДФО, изображены на купюре 2000 рублей?","Мост «Русский», ДВФУ, Космодром «Восточный»"],["На гербе этого дальневосточного города изображены два парусных корабля экспедиции Витуса Беринга — «Святой Пётр» и «Святой Павел», в честь которых город и получил свое составное имя.","Петропавловск-Камчатский"]]},{"name":"Флора и фауна","qs":[["Крупнейшая дикая кошка планеты, основной ареал которой находится на юге Дальнего Востока России вдоль границы с Китаем.","Амурский тигр"],["Реликтовое растение уссурийской тайги, корень которого формой отдаленно напоминает силуэт человека. В восточной медицине его называют «корнем жизни».","Женьшень"],["Во Владивостоке возле Токаревского маяка и на островах залива Петра Великого туристы часто любуются этими очаровательными пятнистыми тюленями, греющимися на камнях.","Нерпа (засчитывается также: пятнистая нерпа / ларга)"],["Если амурских тигров в тайге насчитывается уже более 700, то этого их пятнистого соседа называют самой редкой крупной кошкой на планете — в дикой природе их осталось всего около 120–130 особей. Для их спасения на юго-западе Приморья создан целый национальный парк. Назовите этого хищника.","Дальневосточный леопард (засчитывается: амурский леопард / леопард)"],["На озерах Приморья и Хабаровского края летом можно увидеть цветение реликтового священного цветка Востока. Что это за цветок?","Лотос (Лотос Комарова)"]]},{"name":"Гастрономия","qs":[["Этот гигантский ракообразный, названный в честь дальневосточного полуострова, считается всемирно признанным русским морским деликатесом.","Камчатский краб"],["Популярное северное блюдо из тонко нарезанной замороженной свежей рыбы ценных пород (нельмы, чира, муксуна), которое макают в соль и перец.","Строганина"],["Главный уличный фастфуд Владивостока — паровой пирожок корейского происхождения из мягкого теста с начинкой из мяса, капусты и пряностей.","Пян-се (пянсе)"],["Весной в дальневосточной тайге массово собирают побеги этого лесного растения. Их засаливают, жарят с мясом и экспортируют в Японию, где верят в его способность выводить радионуклиды.","Папоротник (папоротник-орляк)"],["В 1967 году на фабрике во Владивостоке создали рецепт конфет «Птичье молоко». Вместо желатина мастер Анна Чулкова применила вещество из морских водорослей анфельции. Какое?","Агар-агар"]]},{"name":"Сленг и локальный колорит","qs":[["Жители Сахалина, Курил, Камчатки и Магадана называют остальную (европейскую и сибирскую) часть России одним географическим словом, подчеркивающим их обособленность: например, говорят «лечу в отпуск на...» или «приехал с...». Каким словом они называют «большую землю»?","Материк («на материк» / «с материка»)"],["На Дальнем Востоке этим словом называют не только холмы и горы, но и ориентиры в городе. О каком слове речь?","Сопка"],["Так в городах ДФО называют аутентичные бюджетные кафе китайской кухни. Слово произошло от китайского выражения «есть рис/кушать».","Чифанька (чуфанька)"],["Это старое название бухты Лазурная во Владивостоке стало главным пляжным брендом региона — фраза «поехать на...» означает отправиться на пляж с палатками. Как называется это место?","«Шамора» (Бухта Шамора)"],["В северных регионах Дальнего Востока (в Якутии, на Колыме и Чукотке) практически нет асфальтированных трасс. Жизненно важные грузы и продукты туда завозят на грузовиках по сезонным дорогам, которые накатывают прямо по снегу, тундре и замерзшим руслам рек. Как одним словом называют такую временную ледовую автодорогу?","Зимник"]]}],"bg":null,"ui":0.43999999999999995}</script>

var SKEL=document.getElementById("app").outerHTML+document.getElementById("modal").outerHTML;
var S=JSON.parse(document.getElementById("state").textContent),edit=false,anim=true,dirty=false,mode="local",ART=null,L={};
try{L=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){L={}}
if(!L.used)L.used={};
S.used=L.used;
if(L.ui!=null)S.ui=L.ui;
function save(){try{localStorage.setItem(KEY,JSON.stringify(L))}catch(e){}}
function content(){return {title:S.title,points:S.points,cats:S.cats,bg:S.bg,ui:S.ui}}
function applyContent(c){S.title=c.title;S.points=c.points;S.cats=c.cats;S.bg=c.bg||null}
function touch(){dirty=true;if(mode==="local"){L.content=content();save()}}
function buildHtml(c){
var st=JSON.stringify(c).replace(/</g,"\\u003c");
return '<!DOCTYPE html>\n<html lang="ru">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>'+esc(c.title)+'</title>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Manrope:wght@400;600;800&display=swap">\n<style id="css">'+document.getElementById("css").textContent+'</style>\n</head>\n<body>\n'+SKEL+'\n<scr'+'ipt id="state" type="application/json">'+st+'<\/script>\n<scr'+'ipt id="code">'+document.getElementById("code").textContent+'<\/script>\n</body>\n</html>';
}
function publishShared(){
render();
var b=document.getElementById("editBtn");b.textContent="Сохраняю…";b.disabled=true;
ART.publish(buildHtml(content())).then(function(){dirty=false},function(err){
b.disabled=false;render();
var code=err&&err.code;
if(code==="conflict")return;
document.getElementById("hint").textContent=(code==="not_writer"||code==="not_granted")?"У вас нет прав сохранять изменения для всех: они видны только в этом окне.":"Не удалось сохранить для всех ("+(code||"ошибка")+"). Нажмите «Редактировать» и «Сохранить для всех» ещё раз.";
});
}
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function applyBg(){
document.body.style.backgroundImage="url("+(S.bg||DEFAULT_BG)+")";
document.documentElement.style.setProperty("--pa",S.ui);
$("ui").value=Math.round((1-S.ui)*100);
}
function render(){
$("titleBox").innerHTML=edit?'<input class="title-input" id="tIn" value="'+esc(S.title)+'" aria-label="Название игры">':'<h1>'+esc(S.title)+'</h1>';
var h='<div class="corner"></div>';
S.points.forEach(function(p,i){h+='<div class="ph" style="--d:'+(i*50)+'ms">'+(edit?'<input data-p="'+i+'" value="'+esc(p)+'" aria-label="Стоимость">':'')+'</div>'});
S.cats.forEach(function(c,ci){
h+='<div class="cat" style="--d:'+(ci*70)+'ms">'+(edit?'<input data-c="'+ci+'" value="'+esc(c.name)+'" aria-label="Категория">':esc(c.name))+'</div>';
c.qs.forEach(function(q,qi){
var u=S.used[ci+"-"+qi]&&!edit;
h+='<button type="button" class="tile'+(u?' used':'')+'" data-ci="'+ci+'" data-qi="'+qi+'" style="--d:'+(ci*70+qi*50)+'ms" aria-label="'+esc(c.name)+', '+esc(S.points[qi])+'">'+esc(S.points[qi])+'</button>';
});
});
var b=$("board");b.innerHTML=h;b.className="board"+(edit?" editing":"")+(anim?" enter":"");anim=false;
$("editBtn").textContent=edit?(mode==="shared"?"Сохранить для всех":"Готово"):"Редактировать";
$("editBtn").className=edit?"on":"";
$("bgLabel").style.display=$("bgReset").style.display=edit?"":"none";
$("hint").textContent=edit?"Режим редактирования: меняйте названия и стоимость прямо на табло, нажмите на ячейку, чтобы изменить вопрос и ответ."+(mode==="shared"?" Кнопка «Сохранить для всех» опубликует изменения для всех, кто откроет страницу.":""):"Выберите вопрос на табло. Использованные ячейки гаснут; нажмите на погасшую, чтобы вернуть её в игру.";

}
var ct=null;
function open(html,from){
clearTimeout(ct);var m=$("modal"),c=$("card");
m.classList.remove("closing");c.classList.remove("in","out");
c.innerHTML=html;m.classList.add("open");
if(from){var r=from.getBoundingClientRect(),k=c.getBoundingClientRect();c.style.transformOrigin=(r.left+r.width/2-k.left)+"px "+(r.top+r.height/2-k.top)+"px"}else c.style.transformOrigin="50% 50%";
